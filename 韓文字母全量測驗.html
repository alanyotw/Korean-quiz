<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韓文字母全量測驗</title>
    <style>
        :root {
            /* 加深色階後的馬卡龍配色 */
            --bg-color: #f5f0e1;
            --primary-pink: #ff8b94;
            --primary-blue: #79adff;
            --primary-green: #70c1b3;
            --primary-yellow: #f4a261;
            --primary-purple: #a589ff;
            --text-dark: #2d2d2d;
            --btn-shadow: #d1cbc0;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 30px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
            width: 95%;
            max-width: 600px;
            text-align: center;
        }

        h1 { color: var(--primary-pink); font-size: 2.5rem; margin-bottom: 1.5rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.05); }

        /* 選單網格 */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn {
            border: none;
            padding: 18px 10px;
            font-size: 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            color: white;
            box-shadow: 0 5px 0 rgba(0,0,0,0.1);
        }

        .btn:active { transform: translateY(3px); box-shadow: none; }
        .btn-pink { background-color: var(--primary-pink); }
        .btn-blue { background-color: var(--primary-blue); }
        .btn-green { background-color: var(--primary-green); }
        .btn-yellow { background-color: var(--primary-yellow); }
        .btn-purple { background-color: var(--primary-purple); }
        .btn-dark { background-color: #555; grid-column: span 2; margin-top: 10px; }

        .hidden { display: none; }

        /* 測驗介面 */
        #quiz-header { display: flex; justify-content: space-between; font-size: 1.3rem; margin-bottom: 15px; font-weight: bold; }
        #timer { color: var(--primary-pink); font-family: monospace; }

        .question-box { margin: 10px 0; min-height: 180px; }
        .question-text { font-size: 8rem; line-height: 1.1; color: #111; font-weight: 900; }
        
        .tag-batchim { 
            display: inline-block; 
            background: #e76f51; 
            color: white; 
            font-size: 1.4rem; 
            padding: 6px 20px; 
            border-radius: 50px; 
            margin-top: 5px;
            animation: bounce 0.5s ease infinite alternate;
        }

        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.05); } }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 25px 0;
        }

        .option-btn {
            background: #fff;
            border: 4px solid #f0f0f0;
            padding: 16px;
            font-size: 1.8rem;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
            color: #444;
        }

        .option-btn:hover { border-color: var(--primary-blue); background: #f8fbff; }
        .option-btn.selected {
            background-color: var(--primary-blue);
            color: white;
            border-color: #558ee6;
        }

        .nav-btns { display: flex; justify-content: space-between; gap: 12px; }
        .nav-btns .btn { flex: 1; font-size: 1.1rem; }

        /* 結果頁 */
        .score-circle { font-size: 5rem; color: var(--primary-pink); margin: 15px 0; font-weight: 900; }
        .result-list { text-align: left; max-height: 400px; overflow-y: auto; padding-right: 10px; margin-top: 20px; }
        .result-item {
            background: #f9f9f9;
            border-left: 8px solid #ddd;
            margin-bottom: 15px;
            padding: 18px;
            border-radius: 12px;
        }
        .correct-border { border-left-color: var(--primary-green); }
        .wrong-border { border-left-color: var(--primary-pink); }
    </style>
</head>
<body>

    <div id="home-screen" class="container">
        <h1>韓文字母測驗</h1>
        <p style="margin-bottom:20px; font-weight:bold;">測驗將包含該類別「所有」字母</p>
        <div class="menu-grid">
            <button class="btn btn-pink" onclick="startQuiz('basicVowel')">單母音 (10)</button>
            <button class="btn btn-pink" onclick="startQuiz('doubleVowel')">雙母音 (11)</button>
            <button class="btn btn-blue" onclick="startQuiz('basicConsonant')">基本子音 (9)</button>
            <button class="btn btn-blue" onclick="startQuiz('aspirated')">氣音 (5)</button>
            <button class="btn btn-purple" onclick="startQuiz('tense')">緊音 (5)</button>
            <button class="btn btn-yellow" onclick="startQuiz('batchim')">尾音 (12)</button>
            <button class="btn btn-dark" onclick="startQuiz('all')">★ 挑戰全集測驗 (52題) ★</button>
        </div>
    </div>

    <div id="quiz-screen" class="container hidden">
        <div id="quiz-header">
            <span id="progress">1 / 52</span>
            <span id="timer">00:00</span>
        </div>
        <div class="question-box">
            <div class="question-text" id="q-char"></div>
            <div id="q-tag"></div>
        </div>
        <div class="options-container" id="options"></div>
        <div class="nav-btns">
            <button class="btn btn-yellow" id="prev-btn" onclick="prevQuestion()">上一題</button>
            <button class="btn btn-blue" id="next-btn" onclick="nextQuestion()">下一題</button>
            <button class="btn btn-pink hidden" id="submit-btn" onclick="showResults()">繳交問卷</button>
        </div>
    </div>

    <div id="result-screen" class="container hidden">
        <h1>測驗結果</h1>
        <div class="score-circle" id="final-score">0</div>
        <div id="time-spent" style="font-weight:bold; margin-bottom:10px;"></div>
        <div class="result-list" id="explanations"></div>
        <button class="btn btn-green" style="width: 100%; margin-top: 20px;" onclick="location.reload()">回首頁</button>
    </div>

    <script>
        const bank = {
            basicVowel: [
                {q: 'ㅏ', a: 'a', d: '單母音 [a]'}, {q: 'ㅑ', a: 'ya', d: '單母音 [ya]'},
                {q: 'ㅓ', a: 'eo', d: '單母音，嘴張大的 [o]'}, {q: 'ㅕ', a: 'yeo', d: '單母音，嘴張大的 [yo]'},
                {q: 'ㅗ', a: 'o', d: '單母音，嘴縮圓的 [o]'}, {q: 'ㅛ', a: 'yo', d: '單母音，嘴縮圓的 [yo]'},
                {q: 'ㅜ', a: 'u', d: '單母音 [u]'}, {q: 'ㅠ', a: 'yu', d: '單母音 [yu]'},
                {q: 'ㅡ', a: 'eu', d: '單母音 [eu]'}, {q: 'ㅣ', a: 'i', d: '單母音 [i]'}
            ],
            doubleVowel: [
                {q: 'ㅐ', a: 'ae', d: '雙母音 [ae]'}, {q: 'ㅒ', a: 'yae', d: '雙母音 [yae]'},
                {q: 'ㅔ', a: 'e', d: '雙母音 [e]'}, {q: 'ㅖ', a: 'ye', d: '雙母音 [ye]'},
                {q: 'ㅘ', a: 'wa', d: '雙母音 [wa]'}, {q: 'ㅙ', a: 'wae', d: '雙母音 [wae]'},
                {q: 'ㅚ', a: 'oe', d: '雙母音 [oe/we]'}, {q: 'ㅝ', a: 'wo', d: '雙母音 [wo]'},
                {q: 'ㅞ', a: 'we', d: '雙母音 [we]'}, {q: 'ㅟ', a: 'wi', d: '雙母音 [wi]'},
                {q: 'ㅢ', a: 'ui', d: '雙母音 [eu]+[i]'}
            ],
            basicConsonant: [
                {q: 'ㄱ', a: 'g/k', d: '基本子音'}, {q: 'ㄴ', a: 'n', d: '基本子音'},
                {q: 'ㄷ', a: 'd/t', d: '基本子音'}, {q: 'ㄹ', a: 'r/l', d: '基本子音'},
                {q: 'ㅁ', a: 'm', d: '基本子音'}, {q: 'ㅂ', a: 'b/p', d: '基本子音'},
                {q: 'ㅅ', a: 's', d: '基本子音'}, {q: 'ㅇ', a: '(無)', d: '作為初聲時不發音'},
                {q: 'ㅈ', a: 'j', d: '基本子音'}
            ],
            aspirated: [
                {q: 'ㅋ', a: 'k', d: '氣音'}, {q: 'ㅌ', a: 't', d: '氣音'},
                {q: 'ㅍ', a: 'p', d: '氣音'}, {q: 'ㅎ', a: 'h', d: '氣音'},
                {q: 'ㅊ', a: 'ch', d: '氣音'}
            ],
            tense: [
                {q: 'ㄲ', a: 'kk', d: '緊音 (硬音)'}, {q: 'ㄸ', a: 'tt', d: '緊音 (硬音)'},
                {q: 'ㅃ', a: 'pp', d: '緊音 (硬音)'}, {q: 'ㅆ', a: 'ss', d: '緊音 (硬音)'},
                {q: 'ㅉ', a: 'jj', d: '緊音 (硬音)'}
            ],
            batchim: [
                {q: 'ㄱ', a: 'k', d: '尾音塞音 [k]', isB: true}, {q: 'ㄴ', a: 'n', d: '尾音鼻音 [n]', isB: true},
                {q: 'ㄷ', a: 't', d: '尾音塞音 [t]', isB: true}, {q: 'ㄹ', a: 'l', d: '尾音流音 [l]', isB: true},
                {q: 'ㅁ', a: 'm', d: '尾音鼻音 [m]', isB: true}, {q: 'ㅂ', a: 'p', d: '尾音塞音 [p]', isB: true},
                {q: 'ㅅ', a: 't', d: '尾音發 [t] 聲', isB: true}, {q: 'ㅇ', a: 'ng', d: '尾音鼻音 [ng]', isB: true},
                {q: 'ㅈ', a: 't', d: '尾音發 [t] 聲', isB: true}, {q: 'ㅊ', a: 't', d: '尾音發 [t] 聲', isB: true},
                {q: 'ㅋ', a: 'k', d: '尾音發 [k] 聲', isB: true}, {q: 'ㅎ', a: 't', d: '尾音發 [t] 聲', isB: true}
            ]
        };

        let currentQuestions = [];
        let currentIndex = 0;
        let userAnswers = [];
        let timerInterval;
        let secs = 0;

        // 洗牌算法
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function startQuiz(type) {
            let pool = [];
            if(type === 'all') {
                pool = [...bank.basicVowel, ...bank.doubleVowel, ...bank.basicConsonant, ...bank.aspirated, ...bank.tense, ...bank.batchim];
            } else {
                pool = [...bank[type]];
            }

            // 全部字母都拿出來測驗，並洗牌
            currentQuestions = shuffle(pool);
            userAnswers = new Array(currentQuestions.length).fill(null);
            
            // 生成每題的隨機選項
            currentQuestions.forEach(q => {
                let opts = [q.a];
                while(opts.length < 4) {
                    let r = pool[Math.floor(Math.random() * pool.length)].a;
                    if(!opts.includes(r)) opts.push(r);
                }
                q.options = shuffle(opts);
            });

            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            
            secs = 0;
            timerInterval = setInterval(() => {
                secs++;
                let m = Math.floor(secs/60).toString().padStart(2,'0');
                let s = (secs%60).toString().padStart(2,'0');
                document.getElementById('timer').innerText = `${m}:${s}`;
            }, 1000);
            
            currentIndex = 0;
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentQuestions[currentIndex];
            document.getElementById('progress').innerText = `${currentIndex + 1} / ${currentQuestions.length}`;
            document.getElementById('q-char').innerText = q.q;
            
            const tagEl = document.getElementById('q-tag');
            tagEl.innerHTML = q.isB ? '<div class="tag-batchim">尾音 (Batchim)</div>' : '';

            const optDiv = document.getElementById('options');
            optDiv.innerHTML = '';
            q.options.forEach(o => {
                const b = document.createElement('button');
                b.className = `option-btn ${userAnswers[currentIndex] === o ? 'selected' : ''}`;
                b.innerText = o;
                b.onclick = () => { userAnswers[currentIndex] = o; renderQuestion(); };
                optDiv.appendChild(b);
            });

            document.getElementById('prev-btn').style.visibility = currentIndex === 0 ? 'hidden' : 'visible';
            
            const isLast = currentIndex === currentQuestions.length - 1;
            document.getElementById('next-btn').classList.toggle('hidden', isLast);
            document.getElementById('submit-btn').classList.toggle('hidden', !isLast);
        }

        function nextQuestion() { if(currentIndex < currentQuestions.length - 1) { currentIndex++; renderQuestion(); } }
        function prevQuestion() { if(currentIndex > 0) { currentIndex--; renderQuestion(); } }

        function showResults() {
            clearInterval(timerInterval);
            let scoreCount = 0;
            const exp = document.getElementById('explanations');
            exp.innerHTML = '';

            currentQuestions.forEach((q, i) => {
                const correct = userAnswers[i] === q.a;
                if(correct) scoreCount++;
                const item = document.createElement('div');
                item.className = `result-item ${correct ? 'correct-border' : 'wrong-border'}`;
                item.innerHTML = `
                    <div style="font-size:1.4rem;"><strong>#${i+1} 【${q.q}】</strong> ${q.isB ? '<span style="color:#e76f51;font-weight:bold;">(尾音)</span>' : ''}</div>
                    <div style="margin:5px 0;">您的回答：<span style="color:${correct?'var(--primary-green)':'var(--primary-pink)'}; font-weight:bold;">${userAnswers[i] || '未答'}</span></div>
                    <div>正確答案：<span style="color:var(--primary-green); font-weight:bold;">${q.a}</span></div>
                    <div style="margin-top:8px; font-size:0.95rem; color:#666; border-top:1px solid #eee; padding-top:5px;">詳解：${q.d}</div>
                `;
                exp.appendChild(item);
            });

            const finalScore = Math.round((scoreCount / currentQuestions.length) * 100);
            document.getElementById('final-score').innerText = finalScore + " 分";
            document.getElementById('time-spent').innerText = "總耗時: " + document.getElementById('timer').innerText;
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
